name: testing_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Firebase
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  
  # UI & Design
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

fonts:
  - family: HaskoyRegular
    fonts:
      - asset: assets/fonts/Haskoy-Regular.ttf
  - family: HaskoyMedium
    fonts:
      - asset: assets/fonts/Haskoy-Medium.ttf
  - family: HaskoyBold
    fonts:
      - asset: assets/fonts/Haskoy-Bold.ttf
