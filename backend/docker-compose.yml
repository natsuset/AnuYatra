services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://anuyatra:anuyatra@db:5432/anuyatra?sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
      - ENV=development
      - OTP_PROVIDER=mock
      - STORAGE_PROVIDER=local
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: anuyatra
      POSTGRES_PASSWORD: anuyatra
      POSTGRES_DB: anuyatra
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anuyatra"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
